<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RoBits</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #00ff66, #000);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

#box {
  background: #0b0b0b;
  padding: 25px;
  border-radius: 14px;
  width: 330px;
  text-align: center;
  box-shadow: 0 0 25px rgba(0,255,100,.3);
}

input, button, select {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 6px;
  border: none;
}

button {
  background: #00ff66;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #444;
  cursor: not-allowed;
}

#app, #adminPanel {
  display: none;
  margin-top: 15px;
}

#robits {
  font-size: 20px;
  margin: 10px 0;
}
</style>
</head>

<body>
<div id="box">

  <h2>RoBits</h2>

  <!-- LOGIN -->
  <div id="login">
    <input id="username" placeholder="Roblox username">
    <input id="password" type="password" placeholder="Password (NOT Roblox)"
      onkeydown="if(event.key==='Enter') login()">
    <button type="button" onclick="login()">Enter</button>
  </div>

  <!-- APP -->
  <div id="app">
    <div id="robits">RoBits: 0</div>
    <button id="spinBtn" type="button" onclick="spin()">Spin (48h)</button>
    <p id="spinMsg"></p>

    <p style="font-size:12px">
      Buy RoBits via Pls Donate<br>
      Offline donation to <b>robloxclient37</b>
    </p>

    <!-- ADMIN -->
    <div id="adminPanel">
      <h3>Admin</h3>
      <input id="adminPass" type="password" placeholder="Admin password">
      <input id="adminTarget" placeholder="Target username">
      <input id="adminAmount" type="number" placeholder="Amount">
      <select id="adminAction">
        <option value="give">Give</option>
        <option value="take">Take</option>
        <option value="ban">Ban</option>
        <option value="delete">Delete</option>
      </select>
      <button type="button" onclick="adminDo()">Execute</button>
    </div>
  </div>

</div>

<script>
const api = "https://pls-bets.andysparent.workers.dev";
let currentUser = "";

// ---------- LOGIN ----------
async function login() {
  const u = username.value.trim();
  const p = password.value.trim();
  if (!u || !p) return alert("Fill all fields");

  const res = await fetch(api, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "login", u, p })
